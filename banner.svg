<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Eftiare Ahmed Rimon, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1a33"/><stop offset="1" stop-color="#050d1d"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb020" stop-opacity=".28"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></linearGradient>
</defs>
<style>
text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.name{font-weight:900;font-size:88px;fill:#fff;animation:up 1s cubic-bezier(.2,.8,.2,1) both}
.name tspan{fill:#ffb020}
.sub{font-size:32px;font-weight:600;fill:#c9d5ea;opacity:0;animation:cyc 16s infinite}
.s2{animation-delay:4s}.s3{animation-delay:8s}.s4{animation-delay:12s}
.meta{font-size:18px;fill:#8fa0bf}
.line{fill:none;stroke:#ffb020;stroke-width:3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s .4s ease-out forwards}
.area{fill:url(#area);opacity:0;animation:fade 1.5s 2.4s forwards}
.dot{fill:#2fbf71;animation:pulse 2s 3.4s infinite}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:none}22%{opacity:1}26%{opacity:0}100%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%,100%{r:6;opacity:1}50%{r:11;opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sub{opacity:0}.s1{opacity:1!important}.line{stroke-dashoffset:0}.area{opacity:1}}
</style>
<rect width="1200" height="340" fill="url(#bg)"/>
<g stroke="#ffffff" stroke-opacity=".05"><path d="M0 85H1200M0 170H1200M0 255H1200M300 0V340M600 0V340M900 0V340"/></g>
<polygon class="area" points="0,320 90,300 170,310 260,270 350,285 450,240 540,255 640,205 730,225 830,165 920,185 1020,120 1110,135 1200,70 1200,340 0,340"/>
<polyline class="line" pathLength="1" points="0,320 90,300 170,310 260,270 350,285 450,240 540,255 640,205 730,225 830,165 920,185 1020,120 1110,135 1188,72"/>
<circle class="dot" cx="1188" cy="72" r="6"/>
<text class="name" x="60" y="150" textLength="1000" lengthAdjust="spacingAndGlyphs">EFTIARE AHMED <tspan>RIMON</tspan></text>
<text class="sub s1" x="62" y="216" style="opacity:1;animation-name:cyc">Software Engineer</text>
<text class="sub s2" x="62" y="216">Enterprise &amp; Fintech Systems</text>
<text class="sub s3" x="62" y="216">Full-Stack &amp; Backend Developer</text>
<text class="sub s4" x="62" y="216">5 production bugs resolved. 3 features shipped.</text>
<text class="meta" x="62" y="296">Dhaka, Bangladesh  ·  IIT, University of Dhaka  ·  Open to work</text>
</svg>
